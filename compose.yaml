services:
  api:
    build:
      context: .
      dockerfile: FormworkDesignerWeb/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Site__PublicOrigin: ${PUBLIC_ORIGIN:-https://example.by}
      Site__AcceptInquiries: ${ACCEPT_INQUIRIES:-false}
      Site__LegalReviewed: ${LEGAL_REVIEWED:-false}
      Site__OperatorName: ${OPERATOR_NAME:-}
      Site__OperatorAddress: ${OPERATOR_ADDRESS:-}
      Site__PrivacyEmail: ${PRIVACY_EMAIL:-}
      Site__RetentionMonths: ${RETENTION_MONTHS:-12}
      Site__PolicyVersion: ${POLICY_VERSION:-2026-11-03}
      Site__DataDirectory: /data
      TrustedProxy: 172.30.67.3
    volumes:
      - ${DATA_DIRECTORY:-./data}:/data
    networks:
      backend:
        ipv4_address: 172.30.67.2
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - 127.0.0.1:${HTTP_PORT:-8080}:8080
    volumes:
      - ${MEDIA_DIRECTORY:-./media}:/media:ro
    depends_on:
      - api
    networks:
      backend:
        ipv4_address: 172.30.67.3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.67.0/24
