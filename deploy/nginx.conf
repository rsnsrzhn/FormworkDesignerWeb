server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 8k;
    set_real_ip_from 172.30.67.1;
    real_ip_header X-Forwarded-For;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        access_log off;
    }

    location /media/ {
        if ($uri !~ "^/media/(01-primery|02-razbivka|03-vysota|04-list|05-risovanie)\.(jpg|mp4)$") { return 404; }
        alias /media/;
        autoindex off;
        expires 7d;
        access_log off;
        limit_except GET { deny all; }
    }

    location /assets/ { try_files $uri =404; expires 7d; access_log off; }
    location ~ /\. { deny all; }
    location ~* \.(exe|msi|db|sqlite|sqlite3|env|pem|key)$ { deny all; }
    location = /index.html { expires -1; }
    location / { try_files $uri $uri/ /index.html; }
}
