name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: FormworkDesignerWeb/ClientApp/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: npm ci --prefix FormworkDesignerWeb/ClientApp --ignore-scripts
      - run: npm run build --prefix FormworkDesignerWeb/ClientApp
      - run: npm test --prefix FormworkDesignerWeb/ClientApp
      - run: dotnet run --project tests/ValidationTests
      - run: dotnet build FormworkDesignerWeb --configuration Release
      - run: node tests/api/inquiries.mjs
      - run: node FormworkDesignerWeb/ClientApp/node_modules/playwright/cli.js install --with-deps chromium
      - run: FILE_PREVIEW=1 CHROME_PATH='' npm run test:browser --prefix FormworkDesignerWeb/ClientApp
      - run: docker compose build
